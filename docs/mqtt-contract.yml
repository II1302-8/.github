# DockPulse — MQTT Contract
#
# Defines the topics and payload schemas for communication
# between IoT gateways and the backend server.
#
# Broker: Mosquitto (Eclipse)
# Protocol: MQTT v3.1.1 or v5.0
# QoS: 1 (at least once) for status updates, 0 for heartbeats

# ─── Topic Structure ─────────────────────────────────────────
#
# Two trees coexist:
#
#   harbor/{harbor_id}/{dock_id}/{berth_id}/{message_type}
#       Per-berth telemetry (status, heartbeat, command).
#
#   dockpulse/v1/gw/{gateway_id}/{message_type}
#       Per-gateway lifecycle (status, provision/req, provision/resp).
#       Versioned prefix so gateway-scoped topics don't collide with the
#       berth tree as the contract evolves.
#
# Examples:
#   harbor/main/dock-a/berth-001/status
#   harbor/main/dock-a/berth-001/heartbeat
#   harbor/main/dock-b/+/status          ← subscribe to all berths on dock-b
#   harbor/main/#                         ← subscribe to everything
#   dockpulse/v1/gw/gw-dock-a/status
#   dockpulse/v1/gw/+/provision/resp     ← all gateway provisioning replies

topics:
  # ── Published by: Gateway → Consumed by: Backend ──────────

  - topic: "harbor/{harbor_id}/{dock_id}/{berth_id}/status"
    direction: gateway → backend
    description: >
      Sent when a berth's occupancy state changes.
      The gateway should debounce sensor readings before publishing
      (e.g., require 3 consecutive readings over 15 seconds before
      reporting a state change).
    qos: 1
    retain: true
    payload:
      type: json
      schema:
        node_id:
          type: string
          description: >
            Backend-assigned stable identifier (uuid) handed to the gateway
            in the provision/req that adopted this node. The gateway must
            echo it verbatim here so the backend can bind the reading to
            the exact Node row, surviving mesh-layer unicast reassignment.
            A firmware factory-reset wipes the persisted value; re-adoption
            issues a fresh uuid via the next provision/req.
          example: "e9c41985-5df8-47bc-9888-672714dc0fc5"
        berth_id:
          type: string
          description: Berth this reading belongs to
          example: "berth-001"
        mesh_unicast_addr:
          type: string
          required: true
          description: >
            BLE-mesh unicast address of the publishing node, hex-encoded
            with 0x prefix. Backend cross-checks this against the Node row
            registered for berth_id and rejects readings from any other
            unicast, defending against rogue nodes publishing to a berth
            they aren't bound to.
          example: "0x0042"
        occupied:
          type: boolean
          description: true = boat present, false = berth is free
          example: true
        sensor_raw:
          type: integer
          description: Raw sensor value (mm distance for ultrasonic/ToF)
          example: 342
        battery_pct:
          type: integer
          description: Node battery level, 0-100
          example: 87
        timestamp:
          type: string
          format: iso8601
          description: UTC timestamp from gateway
          example: "2026-03-23T14:30:00Z"
      example: |
        {
          "node_id": "e9c41985-5df8-47bc-9888-672714dc0fc5",
          "berth_id": "berth-001",
          "mesh_unicast_addr": "0x0042",
          "occupied": true,
          "sensor_raw": 342,
          "battery_pct": 87,
          "timestamp": "2026-03-23T14:30:00Z"
        }

  - topic: "harbor/{harbor_id}/{dock_id}/{berth_id}/heartbeat"
    direction: gateway → backend
    description: >
      Periodic heartbeat sent every 5 minutes regardless of state change.
      Used by the backend to detect offline nodes — if no heartbeat is
      received within 3x the interval (15 min), the node is considered offline.
    qos: 0
    retain: false
    payload:
      type: json
      schema:
        node_id:
          type: string
          description: See status payload.
          example: "e9c41985-5df8-47bc-9888-672714dc0fc5"
        berth_id:
          type: string
          example: "berth-001"
        mesh_unicast_addr:
          type: string
          required: true
          description: See status payload.
          example: "0x0042"
        occupied:
          type: boolean
          example: true
        battery_pct:
          type: integer
          example: 87
        uptime_s:
          type: integer
          description: Node uptime in seconds since last reboot
          example: 86400
        timestamp:
          type: string
          format: iso8601
          example: "2026-03-23T14:30:00Z"
      example: |
        {
          "node_id": "e9c41985-5df8-47bc-9888-672714dc0fc5",
          "berth_id": "berth-001",
          "mesh_unicast_addr": "0x0042",
          "occupied": true,
          "battery_pct": 87,
          "uptime_s": 86400,
          "timestamp": "2026-03-23T14:30:00Z"
        }

  # ── Published by: Backend → Consumed by: Gateway ──────────

  - topic: "harbor/{harbor_id}/{dock_id}/{berth_id}/command"
    direction: backend → gateway
    description: >
      Commands sent from the backend to a specific node via its gateway.
      Used for LED overrides or requesting an immediate status report.
    qos: 1
    retain: false
    payload:
      type: json
      schema:
        command:
          type: string
          enum: [request_status, set_led, reboot]
          description: The command to execute
        params:
          type: object
          description: Command-specific parameters
          properties:
            led_color:
              type: string
              enum: [green, red, yellow, off]
              description: Only for set_led command
      examples:
        request_status: |
          {
            "command": "request_status"
          }
        set_led: |
          {
            "command": "set_led",
            "params": { "led_color": "yellow" }
          }

  # ── Gateway lifecycle (dockpulse/v1/gw tree) ──────────────

  - topic: "dockpulse/v1/gw/{gateway_id}/status"
    direction: gateway → backend
    description: >
      Gateway online/offline status. Published retained on connect with
      {"online": true} and registered as the MQTT Last-Will so the broker
      publishes {"online": false} on ungraceful disconnect. Backend uses
      this to drive Gateway.status / Gateway.last_seen.
    qos: 1
    retain: true
    last_will:
      payload: '{"online": false}'
    payload:
      type: json
      schema:
        online:
          type: boolean
          description: true on connect, false via LWT on disconnect
          example: true
      example: |
        {"online": true}

  - topic: "dockpulse/v1/gw/{gateway_id}/provision/req"
    direction: backend → gateway
    description: >
      Instructs a specific gateway to drive a BLE Mesh PB-ADV
      provisioning round for a sensor node identified by its mesh UUID.
      Issued by the backend after a harbor master submits an adoption
      request (POST /api/nodes/adopt). The gateway runs at most one
      flow at a time — concurrent reqs return status=err code=busy on
      provision/resp. If ttl_s elapses without on-air completion the
      gateway returns code=timeout.
    qos: 1
    retain: false
    payload:
      type: json
      schema:
        req_id:
          type: string
          description: >
            Adoption request id (uuid). Echoed back on provision/resp so
            the backend can correlate the response with the pending row.
          example: "8f2c4d1a-9b3e-4a17-bf2d-7c5e1a8b9d23"
        uuid:
          type: string
          description: 16-byte mesh device UUID, hex-encoded (32 chars)
          example: "a1b2c3d4e5f60718293a4b5c6d7e8f90"
        oob:
          type: string
          description: >
            Optional 16-byte static-OOB authentication value, hex-encoded.
            Empty string or omitted means no-OOB provisioning.
          example: "0011223344556677889900112233aabb"
        ttl_s:
          type: integer
          description: >
            Provisioning timeout in seconds. Gateway gives up and emits
            code=timeout if the round doesn't complete in time. Default 60.
          example: 60
        berth_id:
          type: string
          description: >
            Optional berth assignment recorded by the gateway after
            provisioning succeeds. When omitted, gateway falls back to
            using the mesh unicast addr as the berth identifier on uplink.
          example: "berth-001"
        node_id:
          type: string
          description: >
            Backend-assigned stable identifier (uuid) the gateway must
            persist alongside the per-node entry (keyed by mesh unicast
            addr) and echo verbatim in every harbor/.../status and
            harbor/.../heartbeat payload as the `node_id` field. Lets the
            backend bind an uplink to the exact Node row provisioned in
            this round, even after a mesh-layer unicast reassignment. A
            firmware factory-reset wipes this; re-adoption issues a new
            uuid via the next provision/req.
          example: "e9c41985-5df8-47bc-9888-672714dc0fc5"
      example: |
        {
          "req_id": "8f2c4d1a-9b3e-4a17-bf2d-7c5e1a8b9d23",
          "uuid": "a1b2c3d4e5f60718293a4b5c6d7e8f90",
          "oob": "0011223344556677889900112233aabb",
          "ttl_s": 60,
          "berth_id": "berth-001",
          "node_id": "e9c41985-5df8-47bc-9888-672714dc0fc5"
        }

  - topic: "dockpulse/v1/gw/{gateway_id}/provision/resp"
    direction: gateway → backend
    description: >
      Result of a provision/req. Backend matches on req_id and finalizes
      the adoption: on ok it persists the Node row with mesh_unicast_addr
      and dev_key_fp; on err it marks the adoption request failed with
      the supplied code/msg. Sent at most once per req_id.
    qos: 1
    retain: false
    payload:
      type: json
      one_of:
        - description: Successful provisioning
          schema:
            req_id:
              type: string
              example: "8f2c4d1a-9b3e-4a17-bf2d-7c5e1a8b9d23"
            status:
              type: string
              enum: [ok]
            unicast_addr:
              type: string
              description: Mesh unicast address assigned to the node, hex
              example: "0x0042"
            dev_key_fp:
              type: string
              description: >
                First 8 bytes of sha256(dev_key), hex-encoded (16 chars).
                Lets backend verify identity on later operations without
                holding the dev_key itself.
              example: "9f3a8b2c4d1e7f60"
          example: |
            {
              "req_id": "8f2c4d1a-9b3e-4a17-bf2d-7c5e1a8b9d23",
              "status": "ok",
              "unicast_addr": "0x0042",
              "dev_key_fp": "9f3a8b2c4d1e7f60"
            }
        - description: Provisioning failure
          schema:
            req_id:
              type: string
            status:
              type: string
              enum: [err]
            code:
              type: string
              description: >
                Machine-readable failure reason. Defined codes — busy
                (another flow active), bad-uuid / bad-oob (malformed
                input), start-fail (mesh stack rejected start), timeout
                (no on-air completion within ttl_s), already-provisioned
                (the gateway already has this UUID in its provisioner
                table; node must be decommissioned or factory-reset
                before it can beacon again), cancelled (backend cancelled
                the pending request via POST /api/adoptions/{id}/cancel),
                unknown (fallback).
              enum:
                [
                  busy,
                  bad-uuid,
                  bad-oob,
                  start-fail,
                  timeout,
                  already-provisioned,
                  cancelled,
                  unknown,
                ]
              example: "timeout"
            msg:
              type: string
              description: Optional human-readable detail
              example: "no PB-ADV beacon from device"
          example: |
            {
              "req_id": "8f2c4d1a-9b3e-4a17-bf2d-7c5e1a8b9d23",
              "status": "err",
              "code": "timeout",
              "msg": "no PB-ADV beacon from device"
            }

  - topic: "dockpulse/v1/gw/{gateway_id}/provision/state"
    direction: gateway → backend
    description: >
      Best-effort phase events emitted while a provision/req is in flight.
      Backend forwards these on the SSE stream so the harbormaster UI shows
      where the flow currently is rather than just spinning until resp.
      Advisory only — terminal state always arrives via provision/resp;
      consumers must not rely on every phase being observed (QoS 0,
      gateway may drop on backpressure).
    qos: 0
    retain: false
    payload:
      type: json
      schema:
        req_id:
          type: string
          description: Echoes the in-flight provision/req's req_id
          example: "8f2c4d1a-9b3e-4a17-bf2d-7c5e1a8b9d23"
        state:
          type: string
          description: >
            Phase the gateway just entered. Defined values — started
            (provisioner armed), link-open (PB-ADV link established),
            pb-adv-done (key exchange complete, beginning configuration),
            cfg-app-key (sending AppKeyAdd), cfg-bind (binding model to
            app key), cfg-pub-set (configuring publish address), complete
            (config done; resp follows).
          enum:
            [
              started,
              link-open,
              pb-adv-done,
              cfg-app-key,
              cfg-bind,
              cfg-pub-set,
              complete,
            ]
          example: "link-open"
      example: |
        {
          "req_id": "8f2c4d1a-9b3e-4a17-bf2d-7c5e1a8b9d23",
          "state": "link-open"
        }

  - topic: "dockpulse/v1/gw/{gateway_id}/decommission/req"
    direction: backend → gateway
    description: >
      Tells a gateway that a previously-adopted node has been retired by
      the operator (POST /api/nodes/{id}/decommission). The gateway must
      send a Config Node Reset to the node (best-effort, asleep nodes may
      miss it) and drop its unicast_addr → berth_id mapping so subsequent
      mesh data from that node is no longer forwarded as berth telemetry.
      The gateway publishes decommission/resp once local cleanup completes;
      backend uses it to detect divergence between DB status and mesh
      state.
    qos: 1
    retain: false
    payload:
      type: json
      schema:
        req_id:
          type: string
          description: >
            Idempotency key. Gateway may dedupe by req_id but the operation
            is itself idempotent (forgetting an unknown unicast is a no-op).
          example: "c1a8e2d6-7f9b-4032-b1ef-2d44e8a09f3c"
        node_id:
          type: string
          description: Backend node id, included for log correlation
          example: "e9c41985-5df8-47bc-9888-672714dc0fc5"
        unicast_addr:
          type: string
          description: Mesh unicast addr to forget, hex
          example: "0x0042"
        berth_id:
          type: string
          description: >
            Berth the node was bound to, included so the gateway can drop
            the right mapping even if it doesn't track unicast addrs.
          example: "berth-001"
      example: |
        {
          "req_id": "c1a8e2d6-7f9b-4032-b1ef-2d44e8a09f3c",
          "node_id": "e9c41985-5df8-47bc-9888-672714dc0fc5",
          "unicast_addr": "0x0042",
          "berth_id": "berth-001"
        }

  - topic: "dockpulse/v1/gw/{gateway_id}/decommission/resp"
    direction: gateway → backend
    description: >
      Result of a decommission/req. Backend matches on req_id and uses
      it to detect divergence — on err, the DB status flip is reverted
      so the operator can retry rather than have the UI lie about a node
      that's still on the mesh. Sent at most once per req_id.
    qos: 1
    retain: false
    payload:
      type: json
      one_of:
        - description: Successful decommission (Config Node Reset sent, local cleanup done)
          schema:
            req_id:
              type: string
              example: "c1a8e2d6-7f9b-4032-b1ef-2d44e8a09f3c"
            node_id:
              type: string
              description: >
                Echoed from req so backend can correlate without tracking
                req_id → node_id state.
              example: "e9c41985-5df8-47bc-9888-672714dc0fc5"
            status:
              type: string
              enum: [ok]
          example: |
            {
              "req_id": "c1a8e2d6-7f9b-4032-b1ef-2d44e8a09f3c",
              "node_id": "e9c41985-5df8-47bc-9888-672714dc0fc5",
              "status": "ok"
            }
        - description: >
            Mesh orphan: local cleanup succeeded but the Config Node Reset
            never received an ack from the node within the retry budget. The
            provisioner slot is freed so the gateway can adopt a replacement,
            but the original node may still hold its keys and remain on the
            mesh. Backend should flag this for operator attention.
          schema:
            req_id:
              type: string
              example: "c1a8e2d6-7f9b-4032-b1ef-2d44e8a09f3c"
            node_id:
              type: string
              example: "e9c41985-5df8-47bc-9888-672714dc0fc5"
            status:
              type: string
              enum: [orphan]
            attempts:
              type: integer
              description: >
                Number of Config Node Reset send attempts before giving up.
                Diagnostic only; backend may log but does not switch on it.
              example: 3
          example: |
            {
              "req_id": "c1a8e2d6-7f9b-4032-b1ef-2d44e8a09f3c",
              "node_id": "e9c41985-5df8-47bc-9888-672714dc0fc5",
              "status": "orphan",
              "attempts": 3
            }
        - description: Decommission failure
          schema:
            req_id:
              type: string
            node_id:
              type: string
              description: Echoed from req. May be absent on bad-req.
            status:
              type: string
              enum: [err]
            code:
              type: string
              description: >
                Machine-readable failure reason. Defined codes — bad-req
                (required field missing or unparseable in the req payload),
                bad-unicast (unicast_addr malformed or out of mesh range),
                nvs-write (local provisioner table cleanup failed), unknown
                (fallback).
              enum:
                [
                  bad-req,
                  bad-unicast,
                  nvs-write,
                  unknown,
                ]
              example: "nvs-write"
            msg:
              type: string
              description: Optional human-readable detail
              example: "esp_err=0x102"
          example: |
            {
              "req_id": "c1a8e2d6-7f9b-4032-b1ef-2d44e8a09f3c",
              "node_id": "e9c41985-5df8-47bc-9888-672714dc0fc5",
              "status": "err",
              "code": "nvs-write",
              "msg": "esp_err=0x102"
            }
