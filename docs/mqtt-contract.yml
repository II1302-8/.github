# DockPulse — MQTT Contract
#
# Defines the topics and payload schemas for communication
# between IoT gateways and the backend server.
#
# Broker: Mosquitto (Eclipse)
# Protocol: MQTT v3.1.1 or v5.0
# QoS: 1 (at least once) for status updates, 0 for heartbeats

# ─── Topic Structure ─────────────────────────────────────────
#
# Two trees coexist:
#
#   harbor/{harbor_id}/{dock_id}/{berth_id}/{message_type}
#       Per-berth telemetry (status, heartbeat, command).
#
#   dockpulse/v1/gw/{gateway_id}/{message_type}
#       Per-gateway lifecycle (status, provision/req, provision/resp).
#       Versioned prefix so gateway-scoped topics don't collide with the
#       berth tree as the contract evolves.
#
# Examples:
#   harbor/main/dock-a/berth-001/status
#   harbor/main/dock-a/berth-001/heartbeat
#   harbor/main/dock-b/+/status          ← subscribe to all berths on dock-b
#   harbor/main/#                         ← subscribe to everything
#   dockpulse/v1/gw/gw-dock-a/status
#   dockpulse/v1/gw/+/provision/resp     ← all gateway provisioning replies

topics:
  # ── Published by: Gateway → Consumed by: Backend ──────────

  - topic: "harbor/{harbor_id}/{dock_id}/{berth_id}/status"
    direction: gateway → backend
    description: >
      Sent when a berth's occupancy state changes.
      The gateway should debounce sensor readings before publishing
      (e.g., require 3 consecutive readings over 15 seconds before
      reporting a state change).
    qos: 1
    retain: true
    payload:
      type: json
      schema:
        node_id:
          type: string
          description: Unique identifier of the sensor node
          example: "node-012"
        berth_id:
          type: string
          description: Berth this reading belongs to
          example: "berth-001"
        occupied:
          type: boolean
          description: true = boat present, false = berth is free
          example: true
        sensor_raw:
          type: integer
          description: Raw sensor value (mm distance for ultrasonic/ToF)
          example: 342
        battery_pct:
          type: integer
          description: Node battery level, 0-100
          example: 87
        timestamp:
          type: string
          format: iso8601
          description: UTC timestamp from gateway
          example: "2026-03-23T14:30:00Z"
      example: |
        {
          "node_id": "node-012",
          "berth_id": "berth-001",
          "occupied": true,
          "sensor_raw": 342,
          "battery_pct": 87,
          "timestamp": "2026-03-23T14:30:00Z"
        }

  - topic: "harbor/{harbor_id}/{dock_id}/{berth_id}/heartbeat"
    direction: gateway → backend
    description: >
      Periodic heartbeat sent every 5 minutes regardless of state change.
      Used by the backend to detect offline nodes — if no heartbeat is
      received within 3x the interval (15 min), the node is considered offline.
    qos: 0
    retain: false
    payload:
      type: json
      schema:
        node_id:
          type: string
          example: "node-012"
        berth_id:
          type: string
          example: "berth-001"
        occupied:
          type: boolean
          example: true
        battery_pct:
          type: integer
          example: 87
        uptime_s:
          type: integer
          description: Node uptime in seconds since last reboot
          example: 86400
        timestamp:
          type: string
          format: iso8601
          example: "2026-03-23T14:30:00Z"
      example: |
        {
          "node_id": "node-012",
          "berth_id": "berth-001",
          "occupied": true,
          "battery_pct": 87,
          "uptime_s": 86400,
          "timestamp": "2026-03-23T14:30:00Z"
        }

  # ── Published by: Backend → Consumed by: Gateway ──────────

  - topic: "harbor/{harbor_id}/{dock_id}/{berth_id}/command"
    direction: backend → gateway
    description: >
      Commands sent from the backend to a specific node via its gateway.
      Used for LED overrides or requesting an immediate status report.
    qos: 1
    retain: false
    payload:
      type: json
      schema:
        command:
          type: string
          enum: [request_status, set_led, reboot]
          description: The command to execute
        params:
          type: object
          description: Command-specific parameters
          properties:
            led_color:
              type: string
              enum: [green, red, yellow, off]
              description: Only for set_led command
      examples:
        request_status: |
          {
            "command": "request_status"
          }
        set_led: |
          {
            "command": "set_led",
            "params": { "led_color": "yellow" }
          }

  # ── Gateway lifecycle (dockpulse/v1/gw tree) ──────────────

  - topic: "dockpulse/v1/gw/{gateway_id}/status"
    direction: gateway → backend
    description: >
      Gateway online/offline status. Published retained on connect with
      {"online": true} and registered as the MQTT Last-Will so the broker
      publishes {"online": false} on ungraceful disconnect. Backend uses
      this to drive Gateway.status / Gateway.last_seen.
    qos: 1
    retain: true
    last_will:
      payload: '{"online": false}'
    payload:
      type: json
      schema:
        online:
          type: boolean
          description: true on connect, false via LWT on disconnect
          example: true
      example: |
        {"online": true}

  - topic: "dockpulse/v1/gw/{gateway_id}/provision/req"
    direction: backend → gateway
    description: >
      Instructs a specific gateway to drive a BLE Mesh PB-ADV
      provisioning round for a sensor node identified by its mesh UUID.
      Issued by the backend after a harbor master submits an adoption
      request (POST /api/nodes/adopt). The gateway runs at most one
      flow at a time — concurrent reqs return status=err code=busy on
      provision/resp. If ttl_s elapses without on-air completion the
      gateway returns code=timeout.
    qos: 1
    retain: false
    payload:
      type: json
      schema:
        req_id:
          type: string
          description: >
            Adoption request id (uuid). Echoed back on provision/resp so
            the backend can correlate the response with the pending row.
          example: "8f2c4d1a-9b3e-4a17-bf2d-7c5e1a8b9d23"
        uuid:
          type: string
          description: 16-byte mesh device UUID, hex-encoded (32 chars)
          example: "a1b2c3d4e5f60718293a4b5c6d7e8f90"
        oob:
          type: string
          description: >
            Optional 16-byte static-OOB authentication value, hex-encoded.
            Empty string or omitted means no-OOB provisioning.
          example: "0011223344556677889900112233aabb"
        ttl_s:
          type: integer
          description: >
            Provisioning timeout in seconds. Gateway gives up and emits
            code=timeout if the round doesn't complete in time. Default 60.
          example: 60
        berth_id:
          type: string
          description: >
            Optional berth assignment recorded by the gateway after
            provisioning succeeds. When omitted, gateway falls back to
            using the mesh unicast addr as the berth identifier on uplink.
          example: "berth-001"
      example: |
        {
          "req_id": "8f2c4d1a-9b3e-4a17-bf2d-7c5e1a8b9d23",
          "uuid": "a1b2c3d4e5f60718293a4b5c6d7e8f90",
          "oob": "0011223344556677889900112233aabb",
          "ttl_s": 60,
          "berth_id": "berth-001"
        }

  - topic: "dockpulse/v1/gw/{gateway_id}/provision/resp"
    direction: gateway → backend
    description: >
      Result of a provision/req. Backend matches on req_id and finalizes
      the adoption: on ok it persists the Node row with mesh_unicast_addr
      and dev_key_fp; on err it marks the adoption request failed with
      the supplied code/msg. Sent at most once per req_id.
    qos: 1
    retain: false
    payload:
      type: json
      one_of:
        - description: Successful provisioning
          schema:
            req_id:
              type: string
              example: "8f2c4d1a-9b3e-4a17-bf2d-7c5e1a8b9d23"
            status:
              type: string
              enum: [ok]
            unicast_addr:
              type: string
              description: Mesh unicast address assigned to the node, hex
              example: "0x0042"
            dev_key_fp:
              type: string
              description: >
                First 8 bytes of sha256(dev_key), hex-encoded (16 chars).
                Lets backend verify identity on later operations without
                holding the dev_key itself.
              example: "9f3a8b2c4d1e7f60"
          example: |
            {
              "req_id": "8f2c4d1a-9b3e-4a17-bf2d-7c5e1a8b9d23",
              "status": "ok",
              "unicast_addr": "0x0042",
              "dev_key_fp": "9f3a8b2c4d1e7f60"
            }
        - description: Provisioning failure
          schema:
            req_id:
              type: string
            status:
              type: string
              enum: [err]
            code:
              type: string
              description: >
                Machine-readable failure reason. Defined codes — busy
                (another flow active), bad-uuid / bad-oob (malformed
                input), start-fail (mesh stack rejected start), timeout
                (no on-air completion within ttl_s), unknown (fallback).
              enum: [busy, bad-uuid, bad-oob, start-fail, timeout, unknown]
              example: "timeout"
            msg:
              type: string
              description: Optional human-readable detail
              example: "no PB-ADV beacon from device"
          example: |
            {
              "req_id": "8f2c4d1a-9b3e-4a17-bf2d-7c5e1a8b9d23",
              "status": "err",
              "code": "timeout",
              "msg": "no PB-ADV beacon from device"
            }
